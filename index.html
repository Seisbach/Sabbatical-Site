<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sabbatical-Sachbuch — Schreibfortschritt</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="site">
    <div class="site-inner">
      <a class="brand" href="index.html">Sabbatical-Sachbuch</a>
      <nav class="site-nav">
        <a href="index.html" class="active">Schreibfortschritt</a>
        <a href="books.html">Bücher</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1 class="page-title">Schreibfortschritt</h1>
    <p class="page-sub">Ein Wort nach dem anderen — jeden Abend ein Eintrag.</p>

    <div id="stats" class="stats"></div>

    <div class="heatmap-card">
      <div class="heatmap-title">Aktivität im Zeitverlauf — jedes Feld ein Tag, dunkler = mehr geschriebene Wörter, orange = an dem Tag gekürzt</div>
      <div class="heatmap-scroll">
        <div class="heatmap-container">
          <div id="heatmap-months" class="heatmap-months"></div>
          <div class="heatmap-body">
            <div id="heatmap-weekdays" class="heatmap-weekdays"></div>
            <div id="heatmap-grid" class="heatmap-grid"></div>
          </div>
        </div>
      </div>
      <div class="heatmap-legend">
        weniger
        <span class="heatmap-cell" style="background: var(--scale-0)"></span>
        <span class="heatmap-cell" style="background: var(--scale-1)"></span>
        <span class="heatmap-cell" style="background: var(--scale-2)"></span>
        <span class="heatmap-cell" style="background: var(--scale-3)"></span>
        <span class="heatmap-cell" style="background: var(--scale-4)"></span>
        mehr
      </div>
    </div>

    <h2 class="feed-title">Tagebuch</h2>
    <div id="feed"></div>
  </main>

  <script src="assets/tracker.js"></script>
</body>
</html>
