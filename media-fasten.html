    <p class="page-sub" id="challenge-sub">Challenge läuft …</p>

    <div class="fast-hero">
      <div class="fast-timer">
        <div class="fast-timer-value" id="live-counter">–</div>
        <div class="fast-timer-label">seit letztem Medienkonsum, der die Streak gebrochen hat</div>
      </div>
      <div class="fast-best">
        <div class="stat-value" id="best-streak">–</div>

            <path d="M70 112 L70 92" class="g-stem" />
            <path d="M70 96 C 62 92, 62 100, 68 102" class="g-leaf" />
            <path d="M70 96 C 78 92, 78 100, 72 102" class="g-leaf" />
            <path d="M100 112 L100 82" class="g-stem" />
            <path d="M100 88 C 90 82, 88 90, 94 94" class="g-leaf" />
            <path d="M100 88 C 110 82, 112 90, 106 94" class="g-leaf" />
            <path d="M100 96 C 92 94, 90 100, 96 102" class="g-leaf" />

            <rect x="0" y="110" width="200" height="30" class="g-soil-3" />

      <div class="garden-caption" id="garden-caption">–</div>

    <h2 class="feed-title">Verlauf</h2>
    <div id="category-summary" class="stats"></div>
    <div id="fast-history"></div>
  </main>

  <script src="assets/media-fasten.js"></script>

</html>
